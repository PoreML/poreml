# scale_push: the scale study repeated on the push-forward fine-tune's rollout-best checkpoint
# (case/train_push, ckpts/best_rollout.pt) under the same protocol and data as configs/scale/.
# Generated by util/configs/make_push_study_configs.py from configs/scale/ — edit the source, not this file.
# Transolver++ trained on gdl gen + uCT @128 (Train9, `_all`), scored on the campaign's 256-class domains — Scale-Up.
#
# Scores the newest finished run of case/train/gdl/transolver_all — its ckpts/best.pt (best val mae@phi epoch)
# and its saved config.yaml — under the study's scheme on the campaign's test data. Nothing
# model-specific lives here: the model, its stream and its inputs are whatever that checkpoint was trained with.
# Outputs land in out_dir: frames/, inference_test.json, metrics_test.csv and
# metrics_test.json (which records the checkpoint's path and sha256).
name: scale_push_gdl_transolver_all
data: configs/scale_push/gdl/data.yaml      # shared by the campaign's cells
scheme: configs/scale_push/scheme.yaml           # shared by every cell of the study
checkpoint:
  train_case: case/train_push/gdl/transolver_all
  run: null                                   # pin a run dir or .pt to score something else (recorded in results)
  which: best_rollout                  # the push-forward run's rollout-best epoch (finalise.py), not its one-step best
out_dir: case/scale_push/gdl/transolver_all
