# shift_push: the shift study repeated on the push-forward fine-tune's rollout-best checkpoint
# (case/train_push, ckpts/best_rollout.pt) under the same protocol and data as configs/shift/.
# Generated by util/configs/make_push_study_configs.py from configs/shift/ — edit the source, not this file.
# AB-UPT trained on trapping generated rocks only @128 (`_gen`), scored on the campaign's uCT rocks @128 — Geo-Shift.
#
# Scores the newest finished run of case/train/trapping/abupt_gen — its ckpts/best.pt (best val mae@phi epoch)
# and its saved config.yaml — under the study's scheme on the campaign's test data. Nothing
# model-specific lives here: the model, its stream and its inputs are whatever that checkpoint was trained with.
# Outputs land in out_dir: frames/, inference_test.json, metrics_test.csv and
# metrics_test.json (which records the checkpoint's path and sha256).
name: shift_push_trapping_abupt_gen
data: configs/shift_push/trapping/data.yaml      # shared by the campaign's cells
scheme: configs/shift_push/scheme.yaml           # shared by every cell of the study
checkpoint:
  train_case: case/train_push/trapping/abupt_gen
  run: null                                   # pin a run dir or .pt to score something else (recorded in results)
  which: best_rollout                  # the push-forward run's rollout-best epoch (finalise.py), not its one-step best
out_dir: case/shift_push/trapping/abupt_gen
