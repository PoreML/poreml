# Transolver++ on the solver's underfill campaign, flipchip solder-ball arrays (22x482x476 frames,
# the wetting melt invades: theta 30-60) — Train10 of the benchmark matrix.
#
# Same data, split, task fields, metrics and rollout protocol as configs/drainage/unet_gen.yaml,
# so the numbers compare like with like; only the model — and therefore the stream it is
# fed — differs. `poreml train -c` copies this file into the run directory unchanged.
name: transolver_underfill_all

data:
  root: data/case              # the PoreML dataset: `poreml download` puts it here
  campaign: underfill
  split: splits/underfill/all.yaml    # frozen Train10 split, 25 / 7 train/val, every flipchip sample used once
  require_finished: true

task:
  name: next_frame               # geometry + `history` past frames -> the next saved frame (5000 LBM steps ahead)
  history: 1
  params:
    fields:                      # each frame is [phi, ux, uy, uz, p], normalised as (x - offset) / scale
      - {name: phi}                             # already in [-1, 1]; solid = -1
      - {name: u, scale: 0.01}                  # the solver's (D,H,W,3) velocity: |u| ~ 1e-3, max ~4e-2 in lattice units; solid = 0
      - {name: p, offset: 0.3333, scale: 0.01}  # LBM p = rho / 3 ~ 0.333 +- 0.003; solid = 0
    stride: 1
    roi: null                    # the flipchip domain has no reservoir / plate buffers (regions is empty): score it all
    conditions:                  # project default: condition every model on the run's parameters,
                                 # one constant static channel each, (transform(value) - offset) / scale
      - {name: M, transform: log10}   # viscosity ratio: decades apart across the campaign -> log10
      - {name: theta, scale: 180}     # contact angle in degrees -> O(1)
    points:                      # the point stream (the model declares representation = points): every pore voxel of
                                 # the rock is a point; features = [geometry channels | phi ux uy uz p], positions
                                 # (ijk + 0.5) / 128
      wall_channel: true  # binary touches-solid flag as feature channel 0 (project default; off rebuilds pre-wall checkpoints)
      geometry_radii: [1, 2, 4, 8]  # binary wall flag, then local solid fraction in 3^3, 5^3, 9^3, 17^3 boxes -> 5 static
                                    # channels; in_channels = 1 + 4 + 2 + 5 (wall | fractions | M theta | fields). Radius 8 added because [1, 2, 4] gave each point at
                                    # most a 9^3 view of the rock — far less geometric context than the voxel models
                                    # see — and the transolver underfits (train loss ~flat over 12 epochs)
      train_points: 262144       # ~5% of the ~4.2M pore points per window — full-point steps would be ~10 s;
                                 # eval and rollout still use every pore voxel
                                 # 2.0 s/step and 18 GB peak at batch 2 on an H200 (util/archive/docs/sketch/point-based.md);
                                 # eval and rollout always use every pore voxel

model:
  name: transolver
  params:
    dim: 256                     # upstream's aircraft setting: n_hidden 256, 4 layers, 8 heads, 32 slices, mlp_ratio 2
    depth: 4
    heads: 8
    slices: 32                   # eidetic states per head
    mlp_ratio: 2
    dropout: 0.1                 # upstream's aircraft setting (main_airplane.py --dropout 0.1); was omitted (0.0)
    residual: true               # predicts the change of every field on top of the most recent frame (starts as persistence)
    checkpoint: true             # activation checkpointing in training (upstream default)
  precision: tf32               # project default (2026-09-10): fp32 storage, TF32 tensor-core matmuls; see precision.py

train:
  epochs: 20                 # equal-epoch protocol: every model on every task trains 20 epochs (windows seen = 20 x the split's windows/epoch; see case/train/README.md)
  val_stride: 32                 # 3k val windows x ~10 s full-point forwards: stride 32 keeps validation ~15 min/epoch
  batch_size: 1                  # as upstream
  lr: 1.0e-3                     # OneCycle peak, as upstream
  weight_decay: 0.0              # upstream trains with plain Adam (train_airplane.py), i.e. no decay; the trainer's
                                 # AdamW default 0.01 decayed everything incl. the learned temperature bias that
                                 # exists to prevent the instability upstream's README warns about
  lr_schedule: onecycle
  grad_clip: 1.0                 # as upstream (hard-coded in their train loop)
  device: auto
  num_workers: 8                 # 8 CPUs per array task (train_task.slurm). A gzip-4 frame costs ~0.45 s to decode and a window needs two, so the loader — not the GPU — paces the voxel models: 4 workers ≈ 0.24 s/window, 8 ≈ 0.14, against 0.03–0.08 s of GPU time (measured 2026-09-02, H200)
  max_batches: null
  eval:                          # periodic full evaluation on the val split (all metrics, incl. eval_only curvature)
    every: 4                     # 5 full evals per run (epochs 4, 8, 12, 16, 20); the last epoch is always evaluated
    stride: 8
    rollout: true
    render: true

rollout:
  horizon: 64                    # 64 saved frames = 320k LBM steps
  start: null
  start_fraction: 0.25

# Identical to configs/drainage/unet_gen.yaml; see the comments there.
metrics:
  - {error: mae, channel: phi}
  - {error: rel_mae, channel: phi}
  - {error: iou, channel: phi}
  - {descriptor: saturation, error: abs_err, channel: phi, phase: w}
  - {descriptor: volume, error: rel_err, channel: phi, phase: w}
  - {descriptor: area, error: rel_err, channel: phi, phase: w}
  - {descriptor: euler, error: pred, channel: phi, phase: w}
  - {descriptor: euler, error: target, channel: phi, phase: w}
  - {descriptor: euler, error: rel_err, channel: phi, phase: w}

  - {descriptor: curvature_hist, phase: w, error: w1,      channel: phi, bins: 50, range: [0.0, 0.25], eval_only: true}
  - {descriptor: curvature_hist, phase: w, error: w1_norm, channel: phi, bins: 50, range: [0.0, 0.25], eval_only: true}
  - {descriptor: curvature_hist, phase: w, error: target,  channel: phi, bins: 50, range: [0.0, 0.25], eval_only: true}
  - {descriptor: curvature_hist, phase: w, error: pred,    channel: phi, bins: 50, range: [0.0, 0.25], eval_only: true}

  # Integral mean curvature over the scored menisci (Minkowski M2 = ∫H dS, in voxel) and its
  # area-weighted mean <H> = M2 / scored area (1/voxel, Pc = 2 sigma <H>); the scored area and
  # the mesh areas behind them land in samples_<split>.csv. Same mesh as curvature_hist.
  - {descriptor: curvature_mean_integral,      error: rel_err, phase: w, channel: phi, eval_only: true}   # |M2_pred - M2_true| / M2_true
  - {descriptor: curvature_mean_integral,      error: target,  phase: w, channel: phi, eval_only: true}   # M2 of the truth
  - {descriptor: curvature_mean_integral,      error: pred,    phase: w, channel: phi, eval_only: true}   #   -> and of the prediction
  - {descriptor: curvature_mean_integral_norm, error: rel_err, phase: w, channel: phi, eval_only: true}   # |<H>_pred - <H>_true| / <H>_true
  - {descriptor: curvature_mean_integral_norm, error: target,  phase: w, channel: phi, eval_only: true}   # <H> of the truth
  - {descriptor: curvature_mean_integral_norm, error: pred,    phase: w, channel: phi, eval_only: true}   #   -> and of the prediction
  - {error: mae, channel: p}
  - {error: mae, channel: ux}
  - {error: mae, channel: uy}
  - {error: mae, channel: uz}

out_dir: case/train/underfill/transolver_all/ckpts
seed: 0
