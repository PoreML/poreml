# UNet3D trained on gdl generated rocks only @128 (`_gen`), scored on the campaign's uCT rocks @128 — Geo-Shift.
#
# Scores the newest finished run of case/train/gdl/unet_gen — its ckpts/best.pt (best val mae@phi epoch)
# and its saved config.yaml — under the study's scheme on the campaign's test data. Nothing
# model-specific lives here: the model, its stream and its inputs are whatever that checkpoint was trained with.
# Outputs land in out_dir: frames/, inference_test.json, metrics_test.csv and
# metrics_test.json (which records the checkpoint's path and sha256).
name: shift_gdl_unet_gen
data: configs/shift/gdl/data.yaml      # shared by the campaign's cells
scheme: configs/shift/scheme.yaml           # shared by every cell of the study
checkpoint:
  train_case: case/train/gdl/unet_gen
  run: null                                   # pin a run dir or .pt to score something else (recorded in results)
  which: best
out_dir: case/shift/gdl/unet_gen
